<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#0f1418" />

    <!--
      Title and description are defaults only. src/components/seo/Seo.jsx
      replaces them per route on navigation, using the copy defined in the
      project documentation. Keeping sensible defaults here means crawlers
      that do not execute JavaScript still get accurate information.
    -->
    <title>Siraj Builders | Professional Construction &amp; Building Services</title>
    <meta
      name="description"
      content="Explore Siraj Builders' professional approach to construction, project management and building solutions. Discuss your project with our team."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siraj Builders" />
    <meta property="og:title" content="Siraj Builders | Professional Construction &amp; Building Services" />
    <meta
      property="og:description"
      content="Construction, managed from the first plan to the final detail."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Scroll-reveal fallback. Elements with .reveal start at opacity:0 and are
      revealed by IntersectionObserver. Without JavaScript they would stay
      permanently invisible, so the entire site would render blank. This makes
      them visible when scripting is unavailable.
    -->
    <noscript>
      <style>
        .reveal { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <noscript>
      This website works best with JavaScript enabled. Please enable JavaScript,
      or contact Siraj Builders directly to discuss your project.
    </noscript>
    <div id="root"></div>
  </body>
</html>
